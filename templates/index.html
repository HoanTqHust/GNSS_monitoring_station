<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS Data Monitor</title>
  <script>
    function refreshSkyplot() {
      const img = document.getElementById("skyplotImg");
      // Thêm timestamp vào URL để tránh cache
      img.src = "/skyplot?time=" + new Date().getTime();
    }
    
    // Refresh skyplot mỗi 2 giây
    setInterval(refreshSkyplot, 2000);
    
    
  </script>
</head>
<body>
  <h1>GPS Data Monitor</h1>
  <div id="mon_span_1"><!-- Nội dung khác nếu cần --></div>
  <div id="mon_span_2"><!-- Nội dung khác nếu cần --></div>
  <div id="nav_sat_1">
      <!-- Skyplot được tạo từ Matplotlib hiển thị dưới dạng PNG -->
      <img id="skyplotImg" src="/skyplot" alt="Skyplot" width="400" height="400">
  </div>
  <div id="nav_sat_2">
      <!-- Bạn có thể hiển thị skyplot khác hoặc dữ liệu khác tại đây -->
  </div>
</body>
</html>
