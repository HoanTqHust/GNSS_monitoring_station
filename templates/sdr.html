<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SDR Spectrogram Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #0a0a0f;
            color: #e0e0e0;
        }

        h1 {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #00d4ff;
            padding: 15px 20px;
            margin: 0;
            text-align: center;
            border-bottom: 2px solid #00d4ff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        h1 .page-title {
            flex: 1;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .nav-btn {
            background-color: rgba(0, 212, 255, 0.15);
            color: #00d4ff;
            padding: 8px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid rgba(0, 212, 255, 0.4);
        }

        .nav-btn:hover {
            background-color: rgba(0, 212, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 15px;
            background-color: #1a1a2e;
            border-bottom: 1px solid #2a2a4a;
            flex-wrap: wrap;
        }

        .stat {
            text-align: center;
            padding: 0 20px;
        }

        .stat-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 16px;
            color: #00d4ff;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0, 212, 255, 0.3);
        }

        #status {
            position: fixed;
            top: 15px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            background-color: #1a1a2e;
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid #2a2a4a;
            z-index: 100;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #f44336;
        }

        .dot.live {
            background-color: #4caf50;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.6);
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .spectrogram-box {
            background: linear-gradient(145deg, #1a1a2e, #0f0f1a);
            border: 2px solid #2a2a4a;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .spectrogram-box h3 {
            color: #00d4ff;
            margin: 0 0 10px 0;
            font-size: 14px;
            text-align: center;
        }

        #spectrogram-container {
            background-color: #000;
            border-radius: 8px;
            min-width: 800px;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #spectrogram {
            max-width: 100%;
            border-radius: 4px;
        }

        #no-image {
            color: #555;
            font-size: 14px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .btn {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #00d4ff;
            border: 1px solid #00d4ff;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(0, 212, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        .btn.danger {
            border-color: #f44336;
            color: #f44336;
        }

        .btn.danger:hover {
            background: rgba(244, 67, 54, 0.2);
            box-shadow: 0 0 15px rgba(244, 67, 54, 0.3);
        }

        #info {
            text-align: center;
            padding: 10px;
            color: #888;
            font-size: 12px;
        }

        @media (max-width: 900px) {
            #spectrogram-container {
                min-width: 100%;
            }
        }
    </style>
</head>

<body>
    <h1>
        <a href="/" class="nav-btn">GNSS Monitor</a>
        <span class="page-title">BladeRF Realtime Spectrogram</span>
    </h1>

    <div class="stats-bar">
        <div class="stat">
            <div class="stat-label">Frequency</div>
            <div class="stat-value" id="freq">1575.42 MHz</div>
        </div>
        <div class="stat">
            <div class="stat-label">Sample Rate</div>
            <div class="stat-value" id="sr">60.0 Msps</div>
        </div>
        <div class="stat">
            <div class="stat-label">Gain</div>
            <div class="stat-value" id="gain">20</div>
        </div>
        <div class="stat">
            <div class="stat-label">FPS</div>
            <div class="stat-value" id="fps">0.00</div>
        </div>
        <div class="stat">
            <div class="stat-label">Frames Saved</div>
            <div class="stat-value" id="frames">0</div>
        </div>
    </div>

    <div id="status">
        <span class="dot" id="dot"></span>
        <span id="statusText">Connecting...</span>
    </div>

    <div class="main-container">
        <div class="spectrogram-box">
            <h3>Real-time Spectrogram (Waterfall)</h3>
            <div id="spectrogram-container">
                <span id="no-image">Chờ dữ liệu spectrogram...</span>
                <img id="spectrogram" style="display: none;" alt="Spectrogram">
            </div>
            <div class="controls">
                <button class="btn" onclick="refreshImage()">Refresh</button>
                <button class="btn danger" onclick="stopAcquisition()">Stop</button>
            </div>
        </div>

        <div id="info"></div>
    </div>

    <script>
        const socket = io();
        let lastFilename = null;
        let refreshTimer = null;
        let frameCount = 0;
        let lastFpsUpdate = Date.now();
        let fps = 0;
        let imgLoading = false;

        function showError(msg) {
            document.getElementById("info").textContent = msg;
            document.getElementById("info").style.color = "#f44336";
        }

        function clearError() {
            document.getElementById("info").textContent = "";
        }

        socket.on("connect", () => {
            document.getElementById("statusText").textContent = "Connected";
            document.getElementById("dot").classList.add("live");
            startRefreshTimer();
        });

        socket.on("disconnect", () => {
            document.getElementById("statusText").textContent = "Disconnected";
            document.getElementById("dot").classList.remove("live");
            stopRefreshTimer();
        });

        socket.on("sdr_data", (data) => {
            clearError();
            if (data.fps !== undefined) {
                document.getElementById("fps").textContent = data.fps.toFixed(2);
            }
            if (data.frames !== undefined) {
                document.getElementById("frames").textContent = data.frames;
            }
        });

        socket.on("sdr_stopped", () => {
            document.getElementById("statusText").textContent = "Stopped";
            document.getElementById("dot").classList.remove("live");
            stopRefreshTimer();
        });

        function startRefreshTimer() {
            if (refreshTimer) return;
            refreshTimer = setInterval(refreshImage, 500);
        }

        function stopRefreshTimer() {
            if (refreshTimer) {
                clearInterval(refreshTimer);
                refreshTimer = null;
            }
        }

        function updateSpectrogram(filename) {
            const img = document.getElementById("spectrogram");
            const noImage = document.getElementById("no-image");

            imgLoading = true;
            img.onload = () => {
                imgLoading = false;
                noImage.style.display = "none";
                img.style.display = "block";
            };
            img.onerror = () => {
                imgLoading = false;
            };

            // Use /sdr/bmp/<basename> endpoint
            const basename = filename.split("/").pop();
            img.src = "/sdr/bmp/" + basename + "?t=" + Date.now();

            document.getElementById("info").textContent = "Showing: " + basename;
            lastFilename = filename;

            document.getElementById("info").textContent = "Showing: " + filename.split("/").pop();
            lastFilename = filename;

            frameCount++;
            const now = Date.now();
            if (now - lastFpsUpdate >= 1000) {
                fps = frameCount / ((now - lastFpsUpdate) / 1000);
                document.getElementById("fps").textContent = fps.toFixed(2);
                frameCount = 0;
                lastFpsUpdate = now;
            }
        }

        function refreshImage() {
            if (imgLoading) return; // Skip if image is still loading
            fetch("/sdr/latest_bmp")
                .then(res => res.json())
                .then(data => {
                    if (data.filename && data.filename !== lastFilename) {
                        updateSpectrogram(data.filename);
                    }
                })
                .catch(() => {});
        }

        function stopAcquisition() {
            fetch("/sdr/stop", { method: "POST" })
                .then(() => {
                    document.getElementById("statusText").textContent = "Stopping...";
                })
                .catch(() => {});
        }
    </script>
</body>

</html>
